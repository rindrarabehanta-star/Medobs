<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Testeur Multi-API IA</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 650px; margin: 30px auto; padding: 20px; line-height: 1.5; }
        label { font-weight: bold; display: block; margin-top: 15px; }
        select, input, textarea { width: 100%; padding: 10px; margin-top: 5px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 5px; }
        textarea { height: 100px; }
        button { margin-top: 15px; padding: 12px 20px; background: #1a73e8; color: white; border: none; border-radius: 5px; cursor: pointer; font-size: 16px; width: 100%; }
        button:hover { background: #1557b0; }
        #response { background: #f4f6f8; padding: 15px; margin-top: 20px; border-radius: 5px; white-space: pre-wrap; border-left: 4px solid #1a73e8; }
    </style>
</head>
<body>

    <h2>Testeur Multi-API (Modèles Gratuits)</h2>

    <label for="modelSelect">1. Choisissez le fournisseur et le modèle :</label>
    <select id="modelSelect">
        <optgroup label="Google AI Studio (1 clé Google pour tout ce groupe)">
            <option value="google|gemini-3.8-flash">Google - Gemini 3.8 Flash (Recommandé)</option>
            <option value="google|gemini-3.6-flash">Google - Gemini 3.6 Flash</option>
            <option value="google|gemini-3.5-flash-lite">Google - Gemini 3.5 Flash-Lite (Ultra rapide)</option>
            <option value="google|gemma-4">Google - Gemma 4 (Open-weight)</option>
        </optgroup>
        <optgroup label="OpenRouter (1 clé OpenRouter pour des dizaines de modèles :free)">
            <option value="openrouter|openrouter/free">OpenRouter - Routeur Automatique Gratuit</option>
            <option value="openrouter|deepseek/deepseek-r1:free">OpenRouter - DeepSeek R1 (Gratuit)</option>
        </optgroup>
        <optgroup label="Groq (1 clé Groq - Vitesse extrême)">
            <option value="groq|llama-3.3-70b-versatile">Groq - Llama 3.3 70B</option>
        </optgroup>
        <optgroup label="Mistral AI (1 clé Mistral)">
            <option value="mistral|mistral-small-latest">Mistral - Mistral Small</option>
        </optgroup>
    </select>

    <label for="apiKey">2. Clé API du fournisseur sélectionné :</label>
    <input type="password" id="apiKey" placeholder="Collez la clé correspondant au fournisseur choisi ci-dessus">

    <label for="prompt">3. Votre question :</label>
    <textarea id="prompt" placeholder="Écrivez votre message ici..."></textarea>

    <button onclick="envoyerRequete()">Envoyer la requête</button>

    <h3>Réponse :</h3>
    <div id="response">En attente d'une requête...</div>

    <script>
        async function envoyerRequete() {
            const selection = document.getElementById('modelSelect').value;
            const [provider, model] = selection.split('|'); // Sépare le fournisseur et le nom du modèle
            const apiKey = document.getElementById('apiKey').value.trim();
            const prompt = document.getElementById('prompt').value.trim();
            const responseDiv = document.getElementById('response');

            if (!apiKey || !prompt) {
                alert("Veuillez renseigner la clé API et votre message.");
                return;
            }

            responseDiv.textContent = `Interrogation de ${model} via ${provider}...`;

            let url = "";
            let headers = { "Content-Type": "application/json" };
            let body = {};

            // CONDITIONNEMENT SELON LE FOURNISSEUR
            if (provider === "google") {
                // Format spécifique à l'API Google Gemini
                url = `https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${apiKey}`;
                body = {
                    contents: [{ parts: [{ text: prompt }] }]
                };
            } else {
                // Format standard (compatible OpenAI) utilisé par OpenRouter, Groq et Mistral
                headers["Authorization"] = `Bearer ${apiKey}`;
                body = {
                    model: model,
                    messages: [{ role: "user", content: prompt }]
                };

                if (provider === "openrouter") {
                    url = "https://openrouter.ai/api/v1/chat/completions";
                } else if (provider === "groq") {
                    url = "https://api.groq.com/openai/v1/chat/completions";
                } else if (provider === "mistral") {
                    url = "https://api.mistral.ai/v1/chat/completions";
                }
            }

            try {
                const response = await fetch(url, {
                    method: "POST",
                    headers: headers,
                    body: JSON.stringify(body)
                });

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.error?.message || JSON.stringify(data));
                }

                // EXTRACTION DE LA RÉPONSE SELON LE FORMAT DU FOURNISSEUR
                let texteFinal = "";
                if (provider === "google") {
                    texteFinal = data.candidates[0].content.parts[0].text;
                } else {
                    texteFinal = data.choices[0].message.content;
                }

                responseDiv.textContent = texteFinal;

            } catch (err) {
                responseDiv.textContent = "Erreur : " + err.message;
            }
        }
    </script>

</body>
</html>
