<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test API Gemini</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 600px; margin: 40px auto; padding: 20px; }
        textarea { width: 100%; height: 100px; margin-bottom: 10px; }
        button { padding: 10px 20px; background: #1a73e8; color: white; border: none; cursor: pointer; }
        button:hover { background: #1557b0; }
        #response { background: #f1f3f4; padding: 15px; margin-top: 20px; white-space: pre-wrap; }
    </style>
</head>
<body>

    <h2>Test de l'API Gemini en JavaScript</h2>
    
    <label for="apiKey">Clé API Google AI Studio :</label><br>
    <input type="password" id="apiKey" placeholder="Entrez votre clé API ici" style="width: 100%; margin-bottom: 15px; padding: 8px;"><br>

    <label for="prompt">Votre message :</label><br>
    <textarea id="prompt" placeholder="Posez une question à Gemini..."></textarea><br>
    
    <button onclick="appelerGemini()">Envoyer</button>

    <h3>Réponse :</h3>
    <div id="response">En attente d'une question...</div>

    <script>
        async function appelerGemini() {
            const apiKey = document.getElementById('apiKey').value.trim();
            const prompt = document.getElementById('prompt').value.trim();
            const responseDiv = document.getElementById('response');

            if (!apiKey || !prompt) {
                alert("Veuillez renseigner la clé API et le message.");
                return;
            }

            responseDiv.textContent = "Génération en cours...";

            // Utilisation du modèle Gemini Flash (rapide et léger)
            const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${apiKey}`;

            const data = {
                contents: [{
                    parts: [{ text: prompt }]
                }]
            };

            try {
                const response = await fetch(url, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });

                const result = await response.json();

                if (response.ok) {
                    // Extraction sécurisée du texte de la réponse
                    const texteReponse = result.candidates[0].content.parts[0].text;
                    responseDiv.textContent = texteReponse;
                } else {
                    responseDiv.textContent = "Erreur : " + (result.error ? result.error.message : "Erreur inconnue");
                }
            } catch (error) {
                responseDiv.textContent = "Erreur réseau : " + error.message;
            }
        }
    </script>

</body>
</html>
